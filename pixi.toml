[workspace]
authors = [
    "Ehsan M. Kermani <ehsanmok@users.noreply.github.com>",
    "Marius S <39998+winding-lines@users.noreply.github.com>",
]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "sqlite.mojo"
version = "0.3.2"
description = "A Mojo binding to SQLite (libsqlite3) via FFI: connections, prepared statements, and RAII transactions."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
# conda-forge splits SQLite in two: `libsqlite` carries libsqlite3.{so,dylib}
# plus sqlite3.h and is what the FFI dlopens; `sqlite` is the command-line
# shell built on top of it, used here only by the cross-check test.
libsqlite = ">=3.45,<4"
sqlite = ">=3.45,<4"
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "3fa66644756c1de7aece83e5a89375323b6e0ce7" }

[tasks]
test-db = "mojo run -I . tests/test_db.mojo"
test-fuzz = "mojo run -I . tests/test_fuzz.mojo"
# Round-trip against the sqlite3 shell, in both directions: proof that the
# files this binding writes are genuine SQLite databases, not merely
# self-consistent ones.
test-crosscheck = "sh tests/crosscheck.sh"
test = { depends-on = ["test-db", "test-fuzz", "test-crosscheck"] }

# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
lint = { cmd = "mojolint --lsp -I . sqlite tests examples" }

example-01 = "mojo run -I . examples/01_hello_sqlite.mojo"
example-02 = "mojo run -I . examples/02_prepared_statements.mojo"
example-03 = "mojo run -I . examples/03_all_types.mojo"
example-04 = "mojo run -I . examples/04_contacts_app.mojo"
example-05 = "mojo run -I . examples/05_transactions.mojo"
examples = { depends-on = [
    "example-01",
    "example-02",
    "example-03",
    "example-04",
    "example-05",
] }

format = "mojo format sqlite tests examples"
fmt = { cmd = "mojo format sqlite tests examples" }
# `mojo format` has no check mode in 1.1.0 — it rejects `--check`, and there is
# none among the hidden options either — so the check is: format, then assert the
# tree did not move. It rewrites the files as a side effect, which is what CI
# wants and is harmless locally; run it with your own work committed or stashed.
format-check = { cmd = "mojo format sqlite tests examples && git diff --exit-code -- sqlite tests examples" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is sqlite-mojo (conda-forge owns "sqlite"); the Mojo
# import stays `from sqlite import …`.
[package]
name = "sqlite-mojo"
version = "0.3.2"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "sqlite"
name = "sqlite"

[package.host-dependencies]
mojo-compiler = "==1.1.0"
libsqlite = ">=3.45,<4"

[package.build-dependencies]
mojo-compiler = "==1.1.0"

[package.run-dependencies]
mojo-compiler = ">=1.1.0,<2"
libsqlite = ">=3.45,<4"

# ── stable / nightly toolchain matrix (see CI) ──────────────────────────────
[feature.nightly.dependencies]
modular = ">=26.7.0.dev2026092005,<28"

[feature.stable.dependencies]
mojo-compiler = "==1.1.0"

[environments]
default = ["nightly"]
stable = ["stable"]
