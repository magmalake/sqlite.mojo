name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ matrix.env }}
          pixi-version: v0.78.0

      # `test` covers the db suite, the property suite, and the round-trip
      # against the sqlite3 shell in both directions.
      - name: Unit tests
        run: pixi run -e ${{ matrix.env }} test

      - name: Examples
        run: pixi run -e ${{ matrix.env }} examples
